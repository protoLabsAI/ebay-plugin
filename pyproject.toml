[project]
name = "ebay-plugin"
version = "0.2.0"
description = "Marketplace price research (eBay + Amazon) + seller economics for protoAgent, via a browser session"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
