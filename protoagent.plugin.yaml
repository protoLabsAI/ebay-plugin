id: ebay
name: Marketplace prices (eBay + Amazon, via browser)
version: 0.3.0
description: >-
  Price research across eBay and Amazon — what an item actually SOLD for on eBay, what it
  is being asked on both, and where today's price sits against what we've recorded before.
  Returns median/quartile statistics plus the underlying listings, and nets a sale out
  after eBay's fees, so a pricing decision rests on numbers rather than impressions.

  Driven through a real signed-in browser (the `agent-browser` CLI), not the eBay API: the
  sold-comps data lives behind eBay's Marketplace Insights API, which is Limited Release and
  closed to new applicants, while the same data is plainly visible in the web UI to a
  signed-in user. Consequences: the browser must be HEADED with a persistent profile (eBay
  serves headless browsers an error page), and you sign in by hand once — the profile keeps
  you signed in. No API keys, and this plugin never handles your credentials.

  Requires the `agent-browser` binary on PATH (`npm i -g agent-browser && agent-browser
  install`). Ships DISABLED; enable with `plugins: { enabled: [ebay] }`.
enabled: false
repository: https://github.com/protoLabsAI/ebay-plugin
min_protoagent_version: "0.27.0"

config_section: ebay
config:
  # The agent-browser CLI on PATH (override for a pinned path).
  binary: agent-browser
  # Named browser session, so eBay work doesn't fight another plugin over the default one.
  session: ebay
  # Persistent browser-profile dir — this is what keeps you signed in to eBay between runs.
  # Blank means no profile, which means signing in every session and losing the sold view.
  # NOTE: profile/headed are DAEMON-level launch options. If a browser daemon is already
  # running under different options the CLI silently ignores these, so the plugin raises
  # instead of browsing as the wrong identity. `agent-browser close --all` then retry.
  profile: ""
  # eBay refuses headless browsers with an error page. Leave this on.
  headed: true
  # Drop the `navigator.webdriver` automation flag Chrome sets under CDP control
  # (`--disable-blink-features=AutomationControlled`, the same flag protoAgent's core browser
  # plugin uses for its stealth option, and nothing more). Google refuses to sign an account
  # in from a browser carrying that flag ("this browser or app may not be secure"), so an eBay
  # account that signs in THROUGH GOOGLE needs this on for the one-time sign-in. It is not an
  # attempt to defeat eBay's own checks: the browser still identifies as Chrome and runs at a
  # human pace. Like profile/headed it applies when the browser STARTS — after changing it,
  # `agent-browser close --session ebay` so the next call relaunches.
  stealth: false
  # Marketplace domains — www.ebay.co.uk / www.amazon.co.uk … for a non-US market.
  domain: www.ebay.com
  amazon_domain: www.amazon.com
  # Local price-observation log. Every check appends to it, and price_history reads it
  # back. Blank = the per-instance default. There is NO retrospective data: Amazon
  # publishes no history and the services that reconstruct one are paid third parties,
  # so this accumulates only from the day the plugin is enabled.
  history_db: ""
  # Per-command subprocess timeout (seconds).
  timeout_s: 60
  # Minimum gap between navigations. Politeness, not evasion: it keeps a research loop from
  # hitting the site faster than a person would. Raise it if eBay starts serving challenges.
  min_interval_s: 1.5
  # Cap on listings returned by one call (a results page holds ~60).
  max_results: 60

capabilities:
  # Declarative only (ADR 0071) — stated so the install review is honest about blast radius.
  # The browser subprocess is outside protoAgent's in-process egress fence (ADR 0008): a
  # browser it drives can reach any site the profile can.
  network: ["*.ebay.com", "*.amazon.com"]
  filesystem: scoped   # the browser profile dir only
  subprocess: true     # shells out to the agent-browser CLI
